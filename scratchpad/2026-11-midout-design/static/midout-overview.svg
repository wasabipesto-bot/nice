<text x="244.0" y="595.0" font-size="11.5" font-weight="600" fill="#4a3aa7" text-anchor="end" paint-order="stroke" stroke="#f6f5f2" stroke-width="5" stroke-linejoin="round">no sync</text>
<text x="688.0" y="400" font-size="11" font-weight="600" fill="#8a8983" text-anchor="start" paint-order="stroke" stroke="#f6f5f2" stroke-width="5" stroke-linejoin="round">RX 9070 XT, ms per slice (share of 4.31)</text>
<text x="688.0" y="784" font-size="11" font-weight="600" fill="#8a8983" text-anchor="start" paint-order="stroke" stroke="#f6f5f2" stroke-width="5" stroke-linejoin="round">tops, parents: measured off the operating point (too high)</text>
