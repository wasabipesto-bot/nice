<text x="470" y="756.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">~338k entries per slice</text>
<rect x="688.0" y="736.0" width="120" height="8" rx="4" fill="#dcdad4"/>
<rect x="688.0" y="736.0" width="3.1" height="8" rx="4" fill="#4a3aa7"/>
