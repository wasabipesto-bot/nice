<text x="470" y="918.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">one random slice recomputed by the CPU, n for n</text>
<path d="M470,854 L470,874" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270.0" y="950" width="400" height="44" rx="10" fill="#fcebf2" stroke="#c2457a" stroke-width="1.6"/>
