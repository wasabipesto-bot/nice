<path d="M470,928 L470,948" fill="none" stroke="#8a8983" stroke-width="2" marker-end="url(#ah)"/>
<path d="M270.0,972 H60 V276 H268.0" fill="none" stroke="#8a8983" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="66" y="600.0" font-size="11.5" font-weight="600" fill="#8a8983" text-anchor="start" paint-order="stroke" stroke="#f6f5f2" stroke-width="5" stroke-linejoin="round">next field</text>
<text x="1065" y="238" font-size="11.5" font-weight="700" fill="#8a8983" text-anchor="start">TODAY&#x27;S OVERLAP JOIN, FOR COMPARISON</text>
<rect x="1065.0" y="250" width="300" height="50" rx="10" fill="#efeeea" stroke="#7a7974" stroke-width="1.6"/>
<text x="1215" y="272.0" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">a 1e17 range of n per field</text>
<text x="1215" y="291.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">tops certified per field (f0 3)</text>
<rect x="1065.0" y="314" width="300" height="50" rx="10" fill="#efeeea" stroke="#7a7974" stroke-width="1.6"/>
<text x="1215" y="336.0" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">bottoms rebuilt per partition</text>
<text x="1215" y="355.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">12 certified digits (k 6)</text>
<rect x="1065.0" y="378" width="300" height="50" rx="10" fill="#efeeea" stroke="#7a7974" stroke-width="1.6"/>
<text x="1215" y="400.0" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">AND walk + prefilter at each flush</text>
<text x="1215" y="419.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">one 64-bit AND per pair · 6 % pass</text>
<rect x="1065.0" y="442" width="300" height="50" rx="10" fill="#efeeea" stroke="#7a7974" stroke-width="1.6"/>
<text x="1215" y="472.0" font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">the same check</text>
<text x="1065" y="520" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Same pairs tested per n at base 64; each costs</text>
<text x="1065" y="537" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">about ×6–8 less here, and the work around them is</text>
<text x="1065" y="554" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">shared by 2^45 n instead of one 1e17 range (judged).</text>
<text x="1065" y="596" font-size="11.5" font-weight="700" fill="#8a8983" text-anchor="start">MEASURED, 2026-11-19, AGAINST v3.4.8&#x27;s JOIN</text>
<text x="1065" y="622" font-size="13" font-weight="500" fill="#0b0b0b" text-anchor="start">RX 9070 XT, base 64</text>
<text x="1285" y="622" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">0.99 vs 4.76 fs</text>
<text x="1385" y="622" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">×4.79</text>
<text x="1065" y="648" font-size="13" font-weight="500" fill="#0b0b0b" text-anchor="start">RTX 3080 240 W, base 64</text>
<text x="1285" y="648" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">1.62 vs 6.62 fs</text>
<text x="1385" y="648" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">×4.09</text>
<text x="1065" y="674" font-size="13" font-weight="500" fill="#0b0b0b" text-anchor="start">RTX 3080, base 65</text>
<text x="1285" y="674" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">3.29 fs</text>
<text x="1385" y="674" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">no join today</text>
<text x="1065" y="700" font-size="13" font-weight="500" fill="#0b0b0b" text-anchor="start">RX 9070 XT, base 65</text>
<text x="1285" y="700" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">3.1 fs</text>
<text x="1385" y="700" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">before its fit</text>
<text x="1065" y="736" font-size="11.5" font-weight="400" fill="#8a8983" text-anchor="start">fs per admissible n · exact on every slice and field tried ·</text>
<text x="1065" y="752" font-size="11.5" font-weight="400" fill="#8a8983" text-anchor="start">the 9070 XT number is the branch just before its cleanup</text>
