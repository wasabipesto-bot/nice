<rect width="1500" height="1060" fill="#f6f5f2"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">The middle-out join: one base-64 field, end to end</text>
<text x="40" y="68" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">A nice-only GPU join whose unit of work is every n sharing five middle digits. Branch dev/mo-clean (10ddbf17); not merged, no server change.</text>
