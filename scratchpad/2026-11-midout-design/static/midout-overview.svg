<line x1="60" y1="148" x2="612" y2="148" stroke="#4a3aa7" stroke-width="3"/>
<text x="336.0" y="164" font-size="12" font-weight="600" fill="#4a3aa7" text-anchor="middle">top: n div 64^4 — a lead value h and a unit d under the slice</text>
<line x1="246" y1="186" x2="860" y2="186" stroke="#2a78d6" stroke-width="3"/>
<text x="553.0" y="202" font-size="12" font-weight="600" fill="#2a78d6" text-anchor="middle">bottom: n mod 64^10 — a parent (digits 0–8) and one of its 64 children (digit 9)</text>
<rect x="886" y="102" width="14" height="14" rx="3" fill="#c2457a"/>
<text x="908" y="114" font-size="12.5" font-weight="500" fill="#0b0b0b" text-anchor="start">pink: a field fixes digits 5–7 (2^57 n, 4,096 slices)</text>
<rect x="886" y="126" width="14" height="14" rx="3" fill="#4a3aa7"/>
<text x="908" y="138" font-size="12.5" font-weight="500" fill="#0b0b0b" text-anchor="start">purple + pink: a slice, digits 4–8 (2^45 n)</text>
<rect x="886" y="150" width="14" height="14" rx="3" fill="#2a78d6"/>
<text x="908" y="162" font-size="12.5" font-weight="500" fill="#0b0b0b" text-anchor="start">blue: the unit, digit 9, paired on</text>
<text x="886" y="188" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Today&#x27;s overlap join: tops = digits 3–12, bottoms = digits 0–5,</text>
<text x="886" y="204" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">field = a 1e17 range of n; bottoms rebuilt per partition.</text>
<text x="40" y="238" font-size="11.5" font-weight="700" fill="#8a8983" text-anchor="start">ONE FIELD</text>
<rect x="270.0" y="250" width="400" height="52" rx="10" fill="#fcebf2" stroke="#c2457a" stroke-width="1.6"/>
<text x="470" y="273.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">claim from a local coordinator</text>
<text x="470" y="292.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">names its coordinate · whole quanta · not the production API</text>
<rect x="270.0" y="324" width="400" height="62" rx="10" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="470" y="344.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">field setup (host, once)</text>
<text x="470" y="363.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">4,096 slices · key from the first slice</text>
<text x="470" y="379.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">parent lists shared across digit 8 · one slice sampled</text>
<rect x="270.0" y="408" width="400" height="52" rx="10" fill="#ebe8f8" stroke="#4a3aa7" stroke-width="1.6"/>
<text x="470" y="431.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">tops</text>
<text x="470" y="450.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">coarse level once per 64 slices · ~238k tops per slice</text>
<rect x="688.0" y="430.0" width="120" height="8" rx="4" fill="#dcdad4"/>
<rect x="688.0" y="430.0" width="21.1" height="8" rx="4" fill="#4a3aa7"/>
<text x="816.0" y="438.0" font-size="11.5" font-weight="600" fill="#52514e" text-anchor="start">0.759 ms (18 %)</text>
<rect x="270.0" y="482" width="400" height="52" rx="10" fill="#ebe8f8" stroke="#4a3aa7" stroke-width="1.6"/>
<text x="470" y="505.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">parents</text>
<text x="470" y="524.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">~1.04M per slice from a shared list (20 % of roots)</text>
<rect x="688.0" y="504.0" width="120" height="8" rx="4" fill="#dcdad4"/>
<rect x="688.0" y="504.0" width="13.2" height="8" rx="4" fill="#4a3aa7"/>
<text x="816.0" y="512.0" font-size="11.5" font-weight="600" fill="#52514e" text-anchor="start">0.476 ms (11 %)</text>
<rect x="270.0" y="556" width="400" height="62" rx="10" fill="#ebe8f8" stroke="#4a3aa7" stroke-width="1.6"/>
<text x="470" y="576.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">main kernel: bit-sliced pairing</text>
<text x="470" y="595.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">children in 64-chunks, one word per digit value</text>
<text x="470" y="611.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">a top tests 64 children with ~17 ORs · common-mask skip</text>
<rect x="688.0" y="583.0" width="120" height="8" rx="4" fill="#dcdad4"/>
<rect x="688.0" y="583.0" width="72.6" height="8" rx="4" fill="#4a3aa7"/>
<text x="816.0" y="591.0" font-size="11.5" font-weight="600" fill="#52514e" text-anchor="start">2.607 ms (60 %)</text>
<rect x="270.0" y="640" width="400" height="52" rx="10" fill="#ebe8f8" stroke="#4a3aa7" stroke-width="1.6"/>
<text x="470" y="663.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">expansion + prefilter</text>
<text x="470" y="682.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">10.9M records → n · 2.87 % pass</text>
<rect x="688.0" y="662.0" width="120" height="8" rx="4" fill="#dcdad4"/>
<rect x="688.0" y="662.0" width="9.9" height="8" rx="4" fill="#4a3aa7"/>
<text x="816.0" y="670.0" font-size="11.5" font-weight="600" fill="#52514e" text-anchor="start">0.356 ms (8 %)</text>
