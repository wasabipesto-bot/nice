<text x="470" y="812.0" font-size="14.5" font-weight="650" fill="#0b0b0b" text-anchor="middle">accounts compared, every 16 slices</text>
<text x="470" y="831.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">each stage&#x27;s own count = what was queued or counted elsewhere</text>
<text x="470" y="847.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">any difference: the field fails, nothing is submitted</text>
